schema_version: 1

context:
  name: csvtk
  version: "0.38.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/shenwei356/csvtk/archive/v${{ version }}.tar.gz
  sha256: 0b2ed4c03b6082179b6c0d117a6d8e74d9bf53f334bb15d952fa059f58206d06

build:
  number: 2

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - csvtk --help

about:
  license: MIT
  license_file:
    - LICENSE
    - csvtk/license-files/
  summary: A cross-platform, efficient and practical CSV/TSV toolkit in Golang
  homepage: https://github.com/shenwei356/csvtk

extra:
  recipe-maintainers:
    - shenwei356
    - apcamargo
